<!-- templates/register.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - InkReal</title>
    <style>
        body {
            font-family: 'Charter', 'Georgia', serif;
            background: #FAF8F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #1a1a1a; font-weight: 300; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #4111CC;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
        }
        button:hover { background: #2a0a8a; }
        .error { color: #d32f2f; font-size: 14px; margin-top: 8px; }
        a { color: #4111CC; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Create Account</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="text" name="display_name" placeholder="Display Name (optional)">
            <button type="submit">Sign Up</button>
        </form>
        <p style="text-align:center; margin-top: 20px;">
            Already have an account? <a href="/auth/login">Log in</a>
        </p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
