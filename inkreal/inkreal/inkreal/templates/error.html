<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ code }} — InkReal</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;background:#FAF8F5;display:flex;align-items:center;justify-content:center;height:100vh;color:#1a1a1a}
.wrap{text-align:center;max-width:480px;padding:24px}
h1{font-family:'Source Serif 4',serif;font-size:96px;font-weight:300;color:#4111CC;margin:0;letter-spacing:-4px}
p{font-size:18px;color:#666;margin:12px 0 32px}
a{display:inline-block;padding:12px 32px;background:#4111CC;color:#fff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:500}
a:hover{background:#5a3dd6}
</style>
</head>
<body>
<div class="wrap">
<h1>{{ code }}</h1>
<p>{{ message }}</p>
<a href="/">Go home</a>
</div>
</body>
</html>
