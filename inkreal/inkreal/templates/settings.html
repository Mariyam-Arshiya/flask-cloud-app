{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="settings-page">
<div class="settings-container">
<h1 class="settings-title">Settings</h1>
<form method="POST" action="{{ url_for('profile.settings') }}" class="settings-form">
<div class="settings-section">
<h2 class="settings-section-title">Profile</h2>
<div class="form-group"><label for="name">Name</label><input type="text" id="name" name="name" value="{{ user.name }}" required></div>
<div class="form-group"><label>Handle</label><input type="text" value="@{{ user.handle }}" disabled class="input-disabled"><p class="form-hint">Handle cannot be changed.</p></div>
<div class="form-group"><label for="avatar_url">Avatar Image URL</label><input type="url" id="avatar_url" name="avatar_url" value="{{ user.avatar_url or '' }}" placeholder="https://images.unsplash.com/..."><p class="form-hint">Use an Unsplash or Pexels image URL.</p></div>
<div class="form-group"><label for="bio">Bio</label><textarea id="bio" name="bio" maxlength="200" rows="3">{{ user.bio or '' }}</textarea></div>
<div class="form-group"><label for="location">Location</label><input type="text" id="location" name="location" value="{{ user.location or '' }}" placeholder="City, Country"></div>
<div class="form-group"><label for="website">Website</label><input type="url" id="website" name="website" value="{{ user.website or '' }}" placeholder="https://yourwebsite.com"></div>
</div>
<div class="settings-actions"><button type="submit" class="btn-primary">Save Changes</button></div>
</form>
<div class="settings-section settings-danger">
<h2 class="settings-section-title">Account</h2>
<a href="{{ url_for('auth.logout') }}" class="btn-logout">Sign Out</a>
</div>
</div>
</div>
{% endblock %}
